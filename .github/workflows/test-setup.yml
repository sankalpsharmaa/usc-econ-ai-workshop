# Runs both setup scripts on brand new macOS and Windows machines.
# Every run starts from a blank VM, so this is the closest thing to a first-year
# student opening a laptop they have never installed anything on.
name: test-setup

# Deliberately NOT on push. Each job boots a blank macOS/Windows VM and installs
# everything from scratch, which takes ~10-60 minutes. Running that on every
# commit is a waste. Run it by hand from the Actions tab when the setup scripts
# change, and once a week to catch a broken upstream installer.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'   # Mondays, 11:17 UTC

concurrency:
  group: test-setup
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dry run, nothing should be installed
        run: bash setup/setup-mac.sh --check

      - name: Full install
        run: bash setup/setup-mac.sh --yes

      - name: Run it a second time, should skip everything
        run: bash setup/setup-mac.sh --yes

      - name: Verify the tools are really there
        run: |
          export PATH="$HOME/.local/bin:$HOME/.juliaup/bin:$PATH"
          set -x
          claude --version
          cursor-agent --version
          codex --version
          uv --version
          Rscript --version
          julia --version
          "$HOME/econ-ai-workshop/.venv/bin/python" -c "import pandas, pyfixest, statsmodels, polars; print('python ok')"
          Rscript -e 'stopifnot(requireNamespace("fixest"), requireNamespace("data.table")); cat("R ok\n")'

      - name: Save the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-log
          path: ~/econ-ai-workshop/setup-mac.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Dry run, nothing should be installed
        run: ./setup/setup-windows.ps1 -Check

      - name: Full install
        run: ./setup/setup-windows.ps1 -Yes

      - name: Run it a second time, should skip everything
        run: ./setup/setup-windows.ps1 -Yes

      - name: Verify the tools are really there
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path','Machine')
          $user    = [Environment]::GetEnvironmentVariable('Path','User')
          $env:Path = "$machine;$user;$HOME\.local\bin;$env:LOCALAPPDATA\cursor-agent"
          claude --version
          cursor-agent --version
          codex --version
          uv --version
          Rscript --version
          julia --version
          & "$HOME\econ-ai-workshop\.venv\Scripts\python.exe" -c "import pandas, pyfixest, statsmodels, polars; print('python ok')"
          Rscript -e 'stopifnot(requireNamespace("fixest"), requireNamespace("data.table")); cat("R ok\n")'

      - name: Save the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-log
          path: ~/econ-ai-workshop/setup-windows.log

  windows-without-r-and-julia:
    # The Windows runner ships with R and Julia preinstalled, so the job above
    # never exercises the winget install path. Hide them first and force it.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Hide the preinstalled R and Julia
        run: |
          foreach ($tool in 'julia', 'Rscript') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              $root = Split-Path (Split-Path $cmd.Source)
              Write-Host "Renaming $root"
              Rename-Item -Path $root -NewName ((Split-Path $root -Leaf) + '-hidden') -ErrorAction Continue
            }
          }
          $r = Join-Path $env:ProgramFiles 'R'
          if (Test-Path $r) { Rename-Item -Path $r -NewName 'R-hidden' -ErrorAction Continue }
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'julia|\\R\\' }) -join ';'
          if (Get-Command julia -ErrorAction SilentlyContinue) { throw 'julia is still visible, the test would prove nothing' }
          Write-Host 'R and Julia are hidden.'

      - name: Full install
        run: ./setup/setup-windows.ps1 -Yes

      - name: Verify R and Julia really got installed
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path','Machine')
          $user    = [Environment]::GetEnvironmentVariable('Path','User')
          $env:Path = "$machine;$user;$HOME\.local\bin;$HOME\.juliaup\bin"
          julia --version
          $rs = Get-ChildItem -Path "$env:ProgramFiles\R" -Filter Rscript.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $rs) { throw 'R did not install' }
          & $rs.FullName --version

      - name: Save the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fresh-log
          path: ~/econ-ai-workshop/setup-windows.log
